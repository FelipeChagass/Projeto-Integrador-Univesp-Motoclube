[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".test-tools", ".test-pgdata", "node_modules", ".venv", ".venv-test"]

[tool.ruff.lint]
# Base incremental: nomes indefinidos e erros de sintaxe são bloqueantes.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
