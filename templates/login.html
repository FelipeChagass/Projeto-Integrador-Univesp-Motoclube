<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Bar Moto Clube</title>
    <link rel="icon" href="{{ url_for('static', filename='img/motorhead.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <div id="login-toast" class="login-toast"></div>

    <div id="login-loading" class="login-loading">
        <div class="spinner"></div>
    </div>

    <div class="login-wrapper d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card w-100 text-center">
            <img src="{{ url_for('static', filename='img/motorhead.png') }}" alt="Bar Moto Clube Logo" class="logo-img">

            <input type="text" id="login-email" class="login-input w-100" placeholder="E-mail" autocomplete="username">

            <div class="senha-wrapper position-relative w-100">
                <input type="password" id="login-senha" class="login-input w-100" placeholder="Senha"
                    autocomplete="current-password">
                <button type="button" id="btn-toggle-senha"
                    class="btn-toggle-senha d-flex align-items-center justify-content-center" tabindex="-1"
                    aria-label="Mostrar senha">

                    <i id="icon-olho-fechado" class="bi bi-eye-slash"></i>

                    <i id="icon-olho-aberto" class="bi bi-eye" style="display:none"></i>
                </button>
            </div>

            <div class="w-100 mb-2 text-start">
                <label class="lembrar-label">
                    <input type="checkbox" id="lembrar-me">
                    <span>Lembre de mim</span>
                </label>
            </div>

            <button class="btn-login-primary w-100" id="btn-login" type="button">ENTRAR</button>

        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/features/auth/login.js') }}"></script>
</body>

</html>
