<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bar Moto Clube</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/motorhead.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tema-bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkboxes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/dialogs.css') }}">
</head>

<body class="page-login">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <div id="login-toast" class="login-toast"></div>

    <div id="login-loading" class="login-loading">
        <div class="spinner"></div>
    </div>

    <div class="login-wrapper d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card w-100 text-center">
            <img src="{{ url_for('static', filename='img/motorhead.svg') }}" alt="Bar Moto Clube Logo" class="logo-img">

            <label for="login-email" class="visually-hidden">E-mail</label>
            <input type="text" id="login-email" class="form-control p-3 mb-3" placeholder="E-mail" autocomplete="username">

            <div class="senha-wrapper position-relative w-100">
                <label for="login-senha" class="visually-hidden">Senha</label>
                <input type="password" id="login-senha" class="form-control py-3 ps-3" placeholder="Senha"
                    autocomplete="current-password">
                <button type="button" id="btn-toggle-senha"
                    class="btn btn-escuro btn-toggle-senha d-flex align-items-center justify-content-center"
                    aria-label="Mostrar senha">

                    <i id="icon-olho-fechado" class="bi bi-eye-slash"></i>

                    <i id="icon-olho-aberto" class="bi bi-eye d-none"></i>
                </button>
            </div>

            <div class="w-100 mb-2 text-start">
                <label class="lembrar-label">
                    <input type="checkbox" id="lembrar-me">
                    <span>Lembre de mim</span>
                </label>
            </div>

            <button class="btn btn-primary btn-lg w-100 mt-2" id="btn-login" type="button">ENTRAR</button>

            <p class="text-body-secondary small opacity-20 mt-4 mb-0">Versão {{ versao_app }}</p>

        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/features/auth/login.js') }}"></script>
</body>

</html>
