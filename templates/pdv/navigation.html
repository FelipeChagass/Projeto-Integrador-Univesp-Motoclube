{# Cabeçalho/sidebar do PDV; eventos ligados pela entrada pdv/app.js.
Incluído por ponto_venda.html; manter IDs únicos na página composta. #}
<header id="app-header">
    <div id="info-topo-esq">
        <img src="{{ url_for('static', filename='img/motorhead.svg') }}" alt="Logo" class="header-logo">
        <div id="barra-operador">CAIXA FECHADO - Toque em Abrir</div>
    </div>

    <div class="top-buttons d-flex align-items-center flex-wrap justify-content-end">
        <button type="button" class="btn btn-contorno btn-estoque d-inline-flex align-items-center gap-2" id="btn-estoque" title="Gerenciar Estoque">
            <i class="bi bi-box-seam flex-shrink-0" aria-hidden="true"></i>
            <span class="btn-text" id="btn-estoque-text">Estoque</span>
        </button>

        <button type="button" class="btn btn-contorno d-inline-flex align-items-center gap-2" id="btn-gestao" title="Gestão de Caixa">
            <i class="bi bi-graph-up flex-shrink-0" aria-hidden="true"></i>
            <span class="btn-text">Gestão de Caixa</span>
        </button>
        <button type="button" class="btn btn-contorno d-inline-flex align-items-center gap-2 d-none" id="btn-admin" title="Painel Admin">
            <i class="bi bi-shield flex-shrink-0" aria-hidden="true"></i>
            <span class="btn-text">Admin</span>
        </button>

        <button type="button" class="btn btn-contorno d-inline-flex align-items-center gap-2" id="btn-config" title="Configurações">
            <i class="bi bi-gear flex-shrink-0" aria-hidden="true"></i>
            <span class="btn-text">Config</span>
        </button>

        <button type="button" class="btn btn-contorno d-inline-flex align-items-center gap-2" id="btn-logout" title="Sair do Sistema">
            <i class="bi bi-box-arrow-right flex-shrink-0" aria-hidden="true"></i>
            <span class="btn-text">Sair</span>
        </button>
    </div>

    <button type="button" class="btn btn-contorno btn-hamburger d-md-none" id="btn-hamburger"
        data-bs-toggle="offcanvas" data-bs-target="#sidebar-mobile" aria-controls="sidebar-mobile" aria-label="Abrir menu">
        <i class="bi bi-list flex-shrink-0" aria-hidden="true"></i>
    </button>
</header>

<div id="sidebar-mobile" class="offcanvas offcanvas-end pdv-menu" tabindex="-1" aria-labelledby="sidebar-titulo">
        <div class="offcanvas-header gap-3">
            <img src="{{ url_for('static', filename='img/motorhead.svg') }}" alt="Logo" class="sidebar-logo">
            <h2 class="offcanvas-title fs-6 flex-grow-1 m-0" id="sidebar-titulo">Menu</h2>
            <button type="button" class="btn btn-contorno btn-hamburger p-2" id="sidebar-close-btn" data-bs-dismiss="offcanvas" aria-label="Fechar menu">
                <i class="bi bi-list flex-shrink-0" aria-hidden="true"></i>
            </button>
        </div>
        <nav class="offcanvas-body d-flex flex-column gap-2" aria-label="Menu do PDV">
            <button type="button" class="btn btn-menu btn-lg d-flex align-items-center gap-3 text-start w-100" id="sidebar-btn-estoque">
                <i class="bi bi-box-seam fs-5 flex-shrink-0" aria-hidden="true"></i>
                <span id="sidebar-btn-estoque-text">Gerenciar Estoque</span>
            </button>
            <button type="button" class="btn btn-menu btn-lg d-flex align-items-center gap-3 text-start w-100" id="sidebar-gestao">
                <i class="bi bi-graph-up fs-5 flex-shrink-0" aria-hidden="true"></i>
                Gestão de Caixa
            </button>
            <button type="button" class="btn btn-menu btn-lg d-flex align-items-center gap-3 text-start w-100 d-none" id="sidebar-btn-admin">
                <i class="bi bi-shield fs-5 flex-shrink-0" aria-hidden="true"></i>
                Painel Admin
            </button>
            <button type="button" class="btn btn-menu btn-lg d-flex align-items-center gap-3 text-start w-100" id="sidebar-config">
                <i class="bi bi-gear fs-5 flex-shrink-0" aria-hidden="true"></i>
                Configurações
            </button>
        </nav>
        <div class="pdv-menu-rodape px-3 pt-3">
            <button type="button" class="btn btn-excluir btn-lg d-flex align-items-center gap-3 text-start w-100" id="sidebar-logout">
                <i class="bi bi-box-arrow-right fs-5 flex-shrink-0" aria-hidden="true"></i>
                Sair do Sistema
            </button>
        </div>
</div>
