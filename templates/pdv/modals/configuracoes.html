{# Preferências locais de impressão; actions/sessao.js, sem mudar configuração global.
   Incluído por ponto_venda.html; manter IDs únicos na página composta. #}
    <div id="modal-config" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-drag-header">
                <div class="drag-handle"></div>
                <h3>Configuração</h3>
            </div>
            <div class="modal-scroll-body">
                <div class="config-option">
                    <label for="cfg-largura">Papel:</label>
                    <select id="cfg-largura" class="config-select">
                        <option value="ticket-80mm">80mm</option>
                        <option value="ticket-58mm">58mm</option>
                    </select>
                </div>
                <div class="config-option">
                    <label>
                        <input type="checkbox" id="cfg-imprimir" class="config-check" checked>
                        Impressão Automática
                    </label>
                </div>
                {% include 'shared/acessibilidade.html' %}
                <button class="btn-action" id="btn-salvar-config">SALVAR</button>
                <button class="btn-action" id="btn-cancelar-config">CANCELAR</button>
            </div>
        </div>
    </div>
