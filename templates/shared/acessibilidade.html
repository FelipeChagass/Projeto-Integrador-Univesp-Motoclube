<div class="form-group my-3 span-2">
    <span id="fonte-label">Tamanho da fonte</span>
    <div class="d-flex align-items-center gap-2 mt-2" role="group" aria-labelledby="fonte-label">
        <button type="button" class="btn btn-sm btn-save" data-fonte="-0.1" aria-label="Diminuir fonte">A−</button>
        <output data-fonte-valor aria-live="polite">100%</output>
        <button type="button" class="btn btn-sm btn-save" data-fonte="0.1" aria-label="Aumentar fonte">A+</button>
    </div>
    <small>Preferência salva neste navegador.</small>
</div>
