<div class="form-group acessibilidade-fonte d-flex flex-column gap-2 mb-2">
    <span class="acessibilidade-fonte-titulo" id="fonte-label">Tamanho da fonte</span>
    <div class="controle-fonte d-inline-flex align-items-center gap-1 p-1" role="group" aria-labelledby="fonte-label">
        <button type="button" class="controle-fonte-btn d-inline-flex align-items-center justify-content-center px-2" data-fonte="-0.1" aria-label="Diminuir fonte">A−</button>
        <output class="controle-fonte-valor" data-fonte-valor aria-live="polite">100%</output>
        <button type="button" class="controle-fonte-btn d-inline-flex align-items-center justify-content-center px-2" data-fonte="0.1" aria-label="Aumentar fonte">A+</button>
    </div>
</div>
