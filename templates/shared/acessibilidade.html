<div class="form-group my-3 span-2 acessibilidade-fonte">
    <span class="acessibilidade-fonte-titulo" id="fonte-label">Tamanho da fonte</span>
    <div class="controle-fonte" role="group" aria-labelledby="fonte-label">
        <button type="button" class="controle-fonte-btn" data-fonte="-0.1" aria-label="Diminuir fonte">A−</button>
        <output class="controle-fonte-valor" data-fonte-valor aria-live="polite">100%</output>
        <button type="button" class="controle-fonte-btn" data-fonte="0.1" aria-label="Aumentar fonte">A+</button>
    </div>
</div>
