{# Aba de membros: barra de ações e tabela; comportamento em admin/membros.js.
Cadastro, edição e ajuste de saldo abrem painéis laterais (admin/paineis/membros.html).
Incluído por admin.html; manter IDs únicos na página composta. #}
<section class="tab-pane" id="tab-membros" role="tabpanel">
    <div class="container-fluid conteudo-admin mx-auto px-2 px-md-3 px-xl-4 py-3 py-xl-4">
        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center flex-wrap gap-3 mb-4">
            <button type="button" class="btn btn-escuro btn-lg d-inline-flex align-items-center justify-content-center gap-2" id="btn-add-membro">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                Novo Membro
            </button>
            <label class="d-flex align-items-center gap-2 small mb-0">
                <input type="checkbox" id="mostrarMembrosInativos">
                <span>Mostrar desativados</span>
            </label>
        </div>

        <div class="table-responsive tabela-moldura">
            <table class="table table-hover align-middle text-start text-md-center mb-0 tabela-cartoes d-block d-md-table">
                <thead class="text-uppercase text-nowrap">
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Saldo Devedor</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaMembros"></tbody>
            </table>
        </div>
    </div>
</section>
