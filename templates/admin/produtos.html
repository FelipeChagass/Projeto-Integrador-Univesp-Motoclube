{# Aba de produtos: barra de ações e tabela; renderização em admin/produtos.js.
Cadastro e edição abrem painéis laterais (admin/paineis/produtos.html).
Incluído por admin.html; manter IDs únicos na página composta. #}
<section class="tab-pane active" id="tab-produtos" role="tabpanel">
    <div class="container-fluid conteudo-admin mx-auto px-2 px-md-3 px-xl-4 py-3 py-xl-4">
        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center flex-wrap gap-3 mb-4">
            <button type="button" class="btn btn-escuro btn-lg d-inline-flex align-items-center justify-content-center gap-2" id="btn-add-produto">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                Novo Produto
            </button>
            <button type="button" class="btn btn-escuro btn-lg d-inline-flex align-items-center justify-content-center gap-2 btn-add-combo" id="btn-add-combo">
                <i class="bi bi-tag" aria-hidden="true"></i>
                Novo Combo
            </button>
            <label class="d-flex align-items-center gap-2 small mb-0">
                <input type="checkbox" id="mostrarProdutosInativos">
                <span>Mostrar desativados</span>
            </label>
        </div>

        <div class="table-responsive tabela-moldura">
            <table class="table table-hover align-middle text-start text-md-center mb-0 tabela-cartoes d-block d-md-table">
                <thead class="text-uppercase text-nowrap">
                    <tr>
                        <th scope="col">Img</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Categ.</th>
                        <th scope="col">Estoque</th>
                        <th scope="col">Mínimos</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos"></tbody>
            </table>
        </div>
    </div>
</section>
