{# Filtros e histórico de vendas; comportamento em admin/vendas.js.
Incluído por admin.html; manter IDs únicos na página composta. #}
<section class="tab-content" id="tab-vendas">
    <div class="container">
        <div class="toolbar d-flex align-items-center flex-wrap">
            <div class="filter-group d-flex align-items-center flex-wrap">
                <label class='text-center'>De:</label><input type="date" id="vendas-data-inicio" class="filter-input">
                <label class='text-center'>Até:</label><input type="date" id="vendas-data-fim" class="filter-input">
                <label class='text-center'>Tipo:</label>
                <select id="vendas-tipo" class="filter-input">
                    <option value="">Todos os tipos</option>
                    <option value="normal">Normal</option>
                    <option value="fiado">Fiado</option>
                    <option value="recebimento_divida">Recebimento</option>
                </select>
                <button class="btn btn-save" id="btn-filtrar-vendas">Filtrar</button>
            </div>
        </div>
        <div id="vendas-resumo" class="stats-row d-flex flex-wrap"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Método</th>
                        <th>Operador</th>
                        <th>Cliente</th>
                        <th>Valor</th>
                        <th>Itens</th>
                    </tr>
                </thead>
                <tbody id="tabelaVendas"></tbody>
            </table>
        </div>
    </div>
</section>
