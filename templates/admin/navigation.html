{# Cabeçalho/sidebar do painel; IDs usados por admin/navigation.js e events.js.
Incluído por admin.html; manter IDs únicos na página composta. #}
<header class="header-admin">
    <div class="header-left d-flex align-items-center">
        <img src="{{ url_for('static', filename='img/motorhead.png') }}" alt="Bar Moto Clube" width="60px"
            class="logo-admin">
        <h1>PAINEL ADMINISTRATIVO</h1>
    </div>

    <nav class="tabs-nav">
        <button class="tab-btn active" id="tab-btn-produtos">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                <path d="m3.3 7 8.7 5 8.7-5" />
                <path d="M12 22V12" />
            </svg>
            <span class="btn-text">Produtos</span>
        </button>
        <button class="tab-btn" id="tab-btn-membros">

                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
            </svg>
            <span class="btn-text">Usuários</span>
        </button>
        <button class="tab-btn" id="tab-btn-vendas">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"

    </button>
