{# Formulário de configurações globais; comportamento em admin/configuracoes.js.
Incluído por admin.html; manter IDs únicos na página composta. #}
<section class="tab-pane" id="tab-config" role="tabpanel">
    <div class="container-fluid conteudo-admin mx-auto px-2 px-md-3 px-xl-4 py-3 py-xl-4">
        <div class="card overflow-hidden">
            <div class="card-header px-3 px-md-4 py-3">
                <h3 class="d-flex align-items-center gap-2 h6 fw-bold m-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
                    Configurações do Sistema
                </h3>
            </div>
            <div class="p-3 p-md-4">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="cfg-imprimir">Impressão Automática</label>
                        <select class="form-select py-2" id="cfg-imprimir">
                            <option value="true">Sim</option>
                            <option value="false">Não</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="cfg-largura">Largura do Papel</label>
                        <select class="form-select py-2" id="cfg-largura">
                            <option value="ticket-80mm">80mm</option>
                            <option value="ticket-58mm">58mm</option>
                        </select>
                    </div>
                    <div class="col-12">
                        {% include 'shared/acessibilidade.html' %}
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column-reverse flex-md-row justify-content-end gap-2 px-3 px-md-4 pb-3 pb-md-4">
                <button type="button" class="btn btn-escuro btn-lg" id="btn-save-config">Salvar Configurações</button>
            </div>
        </div>
    </div>
</section>
