<div class="modal-overlay d-none" id="modalEdicaoFinanceira" role="dialog" aria-modal="true" aria-labelledby="edicao-financeira-titulo">

            <h3 id="edicao-financeira-titulo">Editar venda</h3>
            <button type="button" class="btn-icon-close" data-fechar-edicao aria-label="Fechar">×</button>
        </div>
        <div class="form-grid" id="edicao-financeira-campos"></div>

        </div>
