{# Ajuste de estoque com valores esperados; IDs consumidos por admin/produtos.js.
Incluído por admin.html; manter IDs únicos na página composta. #}
<div class="modal-overlay d-none" id="modalAjusteEstoque">
    <div class="modal-content">
        <div class="modal-header d-flex justify-content-between align-items-center">
            <h3>Ajuste de Estoque</h3>
            <button class="btn-icon-close" id="btn-close-modal-estoque">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <p id="ajuste-estoque-nome" class="admin-estoque-nome"></p>
        <div class="form-grid">
            <div class="form-group"><label>Novo Estoque Bar</label><input type="number" id="ajuste-estoque-bar" min="0">
            </div>
            <div class="form-group"><label>Novo Estoque Depósito</label><input type="number"
                    id="ajuste-estoque-deposito" min="0"></div>
            <div class="form-group"><label>Mínimo Bar (opcional)</label><input type="number" id="ajuste-estoque-min-bar"
                    min="0"></div>
            <div class="form-group"><label>Mínimo Depósito (opcional)</label><input type="number"
                    id="ajuste-estoque-min-deposito" min="0"></div>
            <div class="form-group span-2">
                <label>Motivo do Ajuste</label>
                <input type="text" id="ajuste-estoque-motivo" placeholder="Ex: Contagem do mês, +1 caixa comprada">
            </div>
        </div>
        <div class="form-actions d-flex justify-content-end">
            <button class="btn btn-save" id="btn-confirmar-ajuste-estoque">Salvar</button>
            <button class="btn btn-cancel" id="btn-cancel-modal-estoque">Cancelar</button>
        </div>
    </div>
</div>
