{# Aba de usuários: barra de ações e tabela; comportamento em admin/usuarios.js.
Cadastro e edição abrem o painel lateral (admin/paineis/usuarios.html).
Incluído por admin.html; manter IDs únicos na página composta. #}
<section class="tab-pane" id="tab-usuarios" role="tabpanel">
    <div class="container-fluid conteudo-admin mx-auto px-2 px-md-3 px-xl-4 py-3 py-xl-4">
        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center flex-wrap gap-3 mb-4">
            <button type="button" class="btn btn-escuro btn-lg d-inline-flex align-items-center justify-content-center gap-2" id="btn-add-usuario">
                <i class="bi bi-person-plus" aria-hidden="true"></i>
                Novo Usuário
            </button>
        </div>

        <div class="table-responsive tabela-moldura">
            <table class="table table-hover align-middle text-start text-md-center mb-0 tabela-cartoes d-block d-md-table">
                <thead class="text-uppercase text-nowrap">
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Email</th>
                        <th scope="col">Perfil</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios"></tbody>
            </table>
        </div>
    </div>
</section>
